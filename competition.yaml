version: 2

title: Drug-Induced Autoimmunity Prediction
description: >
  Predict drug-induced autoimmunity using RDKit molecular descriptors.
  Participants must submit a machine learning model trained on the provided
  training data. Performance is evaluated on public and private test sets.

image: logo.png

registration_auto_approve: false

terms: pages/terms.md

pages:
  - title: Participation
    file: pages/participate.md
  - title: Dataset
    file: pages/seed.md
  - title: Timeline
    file: pages/timeline.md

tasks:
  - index: 0
    name: Development Task
    description: >
      Train a model on the training set and generate predictions
      for both public and private test sets.
    input_data: dev_phase/input_data/
    reference_data: dev_phase/reference_data/
    ingestion_program: ingestion_program/
    scoring_program: scoring_program/

solutions:
  - index: 0
    tasks:
      - 0
    path: solution/

phases:
  - name: Development Phase
    description: Development phase for model tuning and validation.
    start: 2026-02-01
    end: 2026-06-30
    tasks:
      - 0

leaderboards:
  - title: Results
    key: main
    columns:
      - title: Public Accuracy
        key: test
        index: 0
        sorting: desc
      - title: Private Accuracy
        key: private_test
        index: 1
        sorting: desc
        hidden: true
      - title: Train Time (s)
        key: train_time
        index: 2
        sorting: asc
      - title: Test Time (s)
        key: test_time
        index: 3
        sorting: asc